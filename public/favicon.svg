<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#0F172A"/>
  <!-- Mast -->
  <rect x="4" y="2" width="7" height="28" rx="1" fill="#F59E0B"/>
  <line x1="4" y1="10" x2="11" y2="10" stroke="#0F172A" stroke-width="0.9" opacity="0.35"/>
  <line x1="4" y1="17" x2="11" y2="17" stroke="#0F172A" stroke-width="0.9" opacity="0.35"/>
  <line x1="4" y1="24" x2="11" y2="24" stroke="#0F172A" stroke-width="0.9" opacity="0.35"/>
  <line x1="4" y1="10" x2="11" y2="2"  stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <line x1="4" y1="2"  x2="11" y2="10" stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <line x1="4" y1="17" x2="11" y2="10" stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <line x1="4" y1="10" x2="11" y2="17" stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <line x1="4" y1="24" x2="11" y2="17" stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <line x1="4" y1="17" x2="11" y2="24" stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <line x1="4" y1="30" x2="11" y2="24" stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <line x1="4" y1="24" x2="11" y2="30" stroke="#0F172A" stroke-width="0.6" opacity="0.2"/>
  <!-- Cabin -->
  <rect x="3" y="1" width="9" height="4" rx="1.5" fill="#B45309"/>
  <!-- Jib (upper K arm) -->
  <polygon points="11,13 11,17 29,5 29,3" fill="#F59E0B"/>
  <!-- Back-stay -->
  <line x1="7.5" y1="2" x2="29" y2="4" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Load cable -->
  <line x1="23" y1="10" x2="23" y2="15" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Hook block -->
  <rect x="21" y="15" width="5" height="2.5" rx="0.8" fill="#9CA3AF"/>
  <!-- Hook -->
  <path d="M21.5,17.5 C21.5,20.5 24.5,20.5 24.5,17.5" stroke="#9CA3AF" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Lower arm (K lower diagonal) -->
  <polygon points="11,17 11,21 26,30 26,28" fill="#F59E0B"/>
  <!-- Foundation -->
  <rect x="3" y="30" width="9" height="2" rx="1" fill="#B45309"/>
</svg>
