version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - KREO_SUNAT_URL=${KREO_SUNAT_URL:-http://2.24.72.21:3020}
      - CORFID_API_URL=${CORFID_API_URL:-}
      - CORFID_TENANT_SLUG=${CORFID_TENANT_SLUG:-hd-consultores}
      - CORFID_WEBHOOK_SECRET=${CORFID_WEBHOOK_SECRET:-}
      # nginx-proxy routing
      - VIRTUAL_HOST=konstruye.site,www.konstruye.site
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=konstruye.site,www.konstruye.site
      - LETSENCRYPT_EMAIL=admin@kreoiastudio.com
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: traefik-public
